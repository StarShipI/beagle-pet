name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          buildozer android debug
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beagle-pet-apk
          path: bin/*.apk
